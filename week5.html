<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Week 5 HTML Tasks</title>
    <!-- This is the code for externally referencing CSS files. -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2 style="color: red; font-size: 30px;">2.1 - HTML Lists</h2>
    
    <!-- 1. Unordered List (Bullet points) -->
    <h3>My Favorite Fruits:</h3>
    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
    </ul>

    <!-- 2. Ordered List (Numbers) -->
    <h3>Steps to make a sandwich:</h3>
    <ol>
        <li>Get two slices of bread.</li>
        <li>Add your favorite fillings.</li>
        <li>Put the slices together.</li>
    </ol>

</body>
</html>
    <!-- 2.2 Tables -->
    <h2>2.2 - HTML Tables</h2>
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>City</th>
        </tr>
        <tr>
            <td>Diana</td>
            <td>20</td>
            <td>Sydney</td>
        </tr>
    </table>
    <!-- 2.3 Image and Hyperlink -->
    <h2>2.3 - Image and Hyperlink</h2>
    <a href="https://www.google.com" target="_blank">
        <img src="https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png" alt="GitHub Logo" width="50">
    </a>
    <!-- 2.4 Forms -->
    <h2>2.4 - HTML Forms</h2>
    <form action="/submit-data" method="GET">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="Enter your name">
        <input type="submit" value="Submit">
    </form>

</body>
</html>
